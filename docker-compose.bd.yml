services:
  database:
    build: ./database
    container_name: cruzazul_postgres
    restart: always
    environment:
      POSTGRES_USER: cruzazul_user
      POSTGRES_PASSWORD: cruzazul_pass
      POSTGRES_DB: cruzazul_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: postgres_data
