<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ERP Cruz Azul</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #005baa;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    h2 {
      color: #005baa;
    }

    form {
      display: grid;
      gap: 10px;
      margin-bottom: 30px;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
    }

    button {
      background: #005baa;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #003f7d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #005baa;
      color: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>ERP Cruz Azul</h1>
  <p>Registro y consulta de productos farmacéuticos</p>
</header>

<main>
  <h2>Ingresar producto</h2>

  <form action="/api/productos" method="POST">
    <input type="text" name="nombre" placeholder="Nombre del producto" required>
    <input type="text" name="categoria" placeholder="Categoría" required>
    <input type="number" name="precio" placeholder="Precio" required>
    <input type="number" name="stock" placeholder="Stock" required>
    <button type="submit">Guardar producto</button>
  </form>

  <h2>Listado de productos</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Precio</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody id="tabla-productos"></tbody>
  </table>
</main>

<script>
  async function cargarProductos() {
    const respuesta = await fetch('/api/productos');
    const productos = await respuesta.json();

    const tabla = document.getElementById('tabla-productos');
    tabla.innerHTML = '';

    productos.forEach(producto => {
      tabla.innerHTML += `
        <tr>
          <td>${producto.id}</td>
          <td>${producto.nombre}</td>
          <td>${producto.categoria}</td>
          <td>$${producto.precio}</td>
          <td>${producto.stock}</td>
        </tr>
      `;
    });
  }

  cargarProductos();
</script>

</body>
</html>
