version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: cruzazul_postgres_eva4
    restart: always
    environment:
      POSTGRES_DB: cruzazul_erp
      POSTGRES_USER: cruzazul_user
      POSTGRES_PASSWORD: cruzazul_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
